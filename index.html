<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>다중 주파수 진단 및 오실로스코프</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 20px;
            background: #121212;
            color: #ffffff;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        button {
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            background: #007bff;
            color: white;
            transition: background 0.2s;
            margin-bottom: 20px;
        }
        button:hover { background: #0056b3; }
        button:disabled { background: #444444; cursor: not-allowed; }
        
        .freq-card {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid #333;
        }
        .freq-display { font-size: 42px; font-weight: bold; color: #00ffcc; font-family: monospace; }
        
        /* 다중 주파수 분석 감시판 */
        .multi-freq-box {
            display: flex;
            justify-content: space-around;
            background: #181818;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #333;
        }
        .multi-freq-item { font-size: 14px; font-family: monospace; }
        .multi-freq-item span { font-weight: bold; color: #ffcc00; }

        canvas {
            width: 100%;
            height: 220px;
            background: #0d0d0d;
            border-radius: 8px;
            border: 1px solid #333;
            display: block;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>실시간 주파수 튐 진단기</h2>
        <button id="startBtn">측정 시작</button>
        
        <div class="freq-card">
            <div style="font-size: 14px; color: #aaa; margin-bottom: 5px;">대표 측정 주파수 (주 신호)</div>
            <div class="freq-display"><span id="freqVal">0.0</span> Hz</div>
        </div>

        <!-- 감지된 주요 3개 주파수 표시 -->
        <div class="multi-freq-box">
            <div class="multi-freq-item">1순위(최대): <span id="top1">0</span> Hz</div>
            <div class="multi-freq-item">2순위: <span id="top2">0</span> Hz</div>
            <div class="multi-freq-item">3순위: <span id="top3">0</span> Hz</div>
        </div>

        <div style="text-align: left; font-size: 12px; color: #aaa; margin: 5px 0;">1. 파형 (Time Domain)</div>
        <canvas id="timeCanvas"></canvas>

        <div style="text-align: left; font-size: 12px; color: #aaa; margin: 5px 0;">2. 주파수 스펙트럼 (Frequency Domain - 0~5kHz)</div>
        <canvas id="freqCanvas"></canvas>
    </div>

    <script>
        let audioCtx;
        let analyser;
        
        const timeCanvas = document.getElementById("timeCanvas");
        const timeCtx = timeCanvas.getContext("2d");
        
        const freqCanvas = document.getElementById("freqCanvas");
        const freqCtx = freqCanvas.getContext("2d");

        function updateCanvasSize() {
            timeCanvas.width = timeCanvas.clientWidth;
            timeCanvas.height = timeCanvas.clientHeight;
            freqCanvas.width = freqCanvas.clientWidth;
            freqCanvas.height = freqCanvas.clientHeight;
        }

        document.getElementById("startBtn").addEventListener("click", async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { 
                        echoCancellation: false, 
                        noiseSuppression: false, 
                        autoGainControl: false 
                    } 
                });
                
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') await audioCtx.resume();

                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 2048;

                const microphone = audioCtx.createMediaStreamSource(stream);
                microphone.connect(analyser);

                document.getElementById("startBtn").innerText = "측정 중...";
                document.getElementById("startBtn").disabled = true;

                updateCanvasSize();
                draw();
            } catch (err) {
                alert("마이크 접근 실패: " + err);
            }
        });

        // 자가상관 주파수 계산
        function autoCorrelate(buf, sampleRate) {
            let SIZE = buf.length;
            let rms = 0;

            for (let i = 0; i < SIZE; i++) {
                let val = buf[i];
                rms += val * val;
            }
            rms = Math.sqrt(rms / SIZE);
            if (rms < 0.01) return -1;

            let r1 = 0, r2 = SIZE - 1, thres = 0.2;
            for (let i = 0; i < SIZE / 2; i++) {
                if (Math.abs(buf[i]) < thres) { r1 = i; break; }
            }
            for (let i = 1; i < SIZE / 2; i++) {
                if (Math.abs(buf[SIZE - i]) < thres) { r2 = SIZE - i; break; }
            }

            buf = buf.slice(r1, r2);
            SIZE = buf.length;

            let c = new Float32Array(SIZE);
            for (let i = 0; i < SIZE; i++) {
                for (let j = 0; j < SIZE - i; j++) {
                    c[i] = c[i] + buf[j] * buf[j + i];
                }
            }

            let d = 0; 
            while (c[d] > c[d + 1]) d++;
            
            let maxval = -1, maxpos = -1;
            for (let i = d; i < SIZE; i++) {
                if (c[i] > maxval) {
                    maxval = c[i];
                    maxpos = i;
                }
            }
            let T0 = maxpos;

            let x1 = c[T0 - 1], x2 = c[T0], x3 = c[T0 + 1];
            let a = (x1 + x3 - 2 * x2) / 2;
            let b = (x3 - x1) / 2;
            if (a) T0 = T0 - b / (2 * a);

            return sampleRate / T0;
        }

        // 주파수 상위 3개 피크 감지
        function getTopFrequencies(freqArray, sampleRate) {
            let peaks = [];
            const binSize = sampleRate / analyser.fftSize;

            for (let i = 2; i < freqArray.length - 2; i++) {
                if (freqArray[i] > 50 && freqArray[i] > freqArray[i - 1] && freqArray[i] > freqArray[i + 1]) {
                    peaks.push({
                        hz: Math.round(i * binSize),
                        val: freqArray[i]
                    });
                }
            }
            peaks.sort((a, b) => b.val - a.val);
            return peaks.slice(0, 3);
        }

        function draw() {
            requestAnimationFrame(draw);

            // 1. 대표 Hz 수치 갱신
            let timeData = new Float32Array(analyser.fftSize);
            analyser.getFloatTimeDomainData(timeData);
            let preciseHz = autoCorrelate(timeData, audioCtx.sampleRate);
            
            if (preciseHz >= 20 && preciseHz <= 15000 && isFinite(preciseHz)) {
                document.getElementById("freqVal").innerText = preciseHz.toFixed(1);
            } else {
                document.getElementById("freqVal").innerText = "0.0";
            }

            // 2. 상위 3개 분산 주파수 모니터링
            let freqByteData = new Uint8Array(analyser.frequencyBinCount);
            analyser.getByteFrequencyData(freqByteData);
            
            let topPeaks = getTopFrequencies(freqByteData, audioCtx.sampleRate);
            document.getElementById("top1").innerText = topPeaks[0] ? topPeaks[0].hz : 0;
            document.getElementById("top2").innerText = topPeaks[1] ? topPeaks[1].hz : 0;
            document.getElementById("top3").innerText = topPeaks[2] ? topPeaks[2].hz : 0;

            // 3. 파형 그래프 그리기
            let byteTimeData = new Uint8Array(analyser.fftSize);
            analyser.getByteTimeDomainData(byteTimeData);

            timeCtx.fillStyle = '#0d0d0d';
            timeCtx.fillRect(0, 0, timeCanvas.width, timeCanvas.height);
            timeCtx.lineWidth = 2;
            timeCtx.strokeStyle = '#00ffcc';
            timeCtx.beginPath();

            const sliceWidth = timeCanvas.width / 512;
            let x = 0;
            for (let i = 0; i < 512; i++) {
                const v = byteTimeData[i] / 128.0;
                const y = (v * timeCanvas.height) / 2;
                if (i === 0) timeCtx.moveTo(x, y);
                else timeCtx.lineTo(x, y);
                x += sliceWidth;
            }
            timeCtx.stroke();

            // 4. 주파수 스펙트럼(막대 그래프) 그리기
            freqCtx.fillStyle = '#0d0d0d';
            freqCtx.fillRect(0, 0, freqCanvas.width, freqCanvas.height);

            const barWidth = (freqCanvas.width / (analyser.frequencyBinCount / 4));
            let posX = 0;

            for (let i = 0; i < analyser.frequencyBinCount / 4; i++) {
                const barHeight = (freqByteData[i] / 255) * freqCanvas.height;
                freqCtx.fillStyle = '#ffcc00';
                freqCtx.fillRect(posX, freqCanvas.height - barHeight, barWidth - 1, barHeight);
                posX += barWidth;
            }
        }

        window.addEventListener('resize', updateCanvasSize);
    </script>
</body>
</html>
