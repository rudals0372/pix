<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>정밀 주파수 측정기 (복구 및 범위 보정)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 20px;
            background: #121212;
            color: #ffffff;
        }
        .container {
            max-width: 650px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        button {
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            background: #007bff;
            color: white;
            transition: background 0.2s;
            margin-bottom: 20px;
        }
        button:hover { background: #0056b3; }
        button:disabled { background: #444444; cursor: not-allowed; }
        .freq-card {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #333;
        }
        .freq-title { font-size: 14px; color: #aaa; margin-bottom: 5px; }
        .freq-display { font-size: 42px; font-weight: bold; color: #00ffcc; }
        canvas {
            width: 100%;
            height: 220px;
            background: #0d0d0d;
            border-radius: 8px;
            border: 1px solid #333;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>실시간 정밀 주파수 분석기</h2>
        <button id="startBtn">측정 시작</button>
        
        <div class="freq-card">
            <div class="freq-title">측정된 주파수</div>
            <div class="freq-display"><span id="freqVal">0.0</span> Hz</div>
        </div>

        <div>
            <canvas id="visualizer"></canvas>
        </div>
    </div>

    <script>
        let audioCtx;
        let analyser;
        let microphone;
        let canvas = document.getElementById("visualizer");
        let canvasCtx = canvas.getContext("2d");

        document.getElementById("startBtn").addEventListener("click", async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { 
                        echoCancellation: false, 
                        noiseSuppression: false, 
                        autoGainControl: false 
                    } 
                });
                
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 2048; // 원래 작동하던 2048 크기로 원복

                microphone = audioCtx.createMediaStreamSource(stream);
                microphone.connect(analyser);

                document.getElementById("startBtn").innerText = "측정 중...";
                document.getElementById("startBtn").disabled = true;

                draw();
            } catch (err) {
                alert("마이크 접근 실패: " + err);
            }
        });

        // 원본 자가상관(Autocorrelation) 알고리즘 + 안전한 탐색범위 수정
        function autoCorrelate(buf, sampleRate) {
            let SIZE = buf.length;
            let rms = 0;

            for (let i = 0; i < SIZE; i++) {
                let val = buf[i];
                rms += val * val;
            }
            rms = Math.sqrt(rms / SIZE);
            if (rms < 0.01) return -1; // 최소 음량 문턱값

            let r1 = 0, r2 = SIZE - 1, thres = 0.2;
            for (let i = 0; i < SIZE / 2; i++) {
                if (Math.abs(buf[i]) < thres) { r1 = i; break; }
            }
            for (let i = 1; i < SIZE / 2; i++) {
                if (Math.abs(buf[SIZE - i]) < thres) { r2 = SIZE - i; break; }
            }

            buf = buf.slice(r1, r2);
            SIZE = buf.length;

            let c = new Float32Array(SIZE);
            for (let i = 0; i < SIZE; i++) {
                for (let j = 0; j < SIZE - i; j++) {
                    c[i] = c[i] + buf[j] * buf[j + i];
                }
            }

            let d = 0; 
            while (c[d] > c[d + 1]) d++;
            
            let maxval = -1, maxpos = -1;
            for (let i = d; i < SIZE; i++) {
                if (c[i] > maxval) {
                    maxval = c[i];
                    maxpos = i;
                }
            }
            let T0 = maxpos;

            let x1 = c[T0 - 1], x2 = c[T0], x3 = c[T0 + 1];
            let a = (x1 + x3 - 2 * x2) / 2;
            let b = (x3 - x1) / 2;
            if (a) T0 = T0 - b / (2 * a);

            return sampleRate / T0;
        }

        function draw() {
            requestAnimationFrame(draw);

            let timeData = new Float32Array(analyser.fftSize);
            analyser.getFloatTimeDomainData(timeData);
            
            let preciseHz = autoCorrelate(timeData, audioCtx.sampleRate);
            
            // 20Hz ~ 15000Hz 범위 내의 정밀 연산값만 화면에 출력
            if (preciseHz >= 20 && preciseHz <= 15000 && isFinite(preciseHz)) {
                document.getElementById("freqVal").innerText = preciseHz.toFixed(1);
            } else {
                document.getElementById("freqVal").innerText = "0.0";
            }

            // 실시간 Waveform 캔버스 그리기 (초기 코드 동일)
            let byteTimeData = new Uint8Array(analyser.fftSize);
            analyser.getByteTimeDomainData(byteTimeData);

            canvasCtx.fillStyle = '#0d0d0d';
            canvasCtx.fillRect(0, 0, canvas.width, canvas.height);

            canvasCtx.lineWidth = 2;
            canvasCtx.strokeStyle = '#00ffcc';
            canvasCtx.beginPath();

            const sliceWidth = canvas.width * 1.0 / analyser.fftSize;
            let x = 0;

            for (let i = 0; i < analyser.fftSize; i++) {
                const v = byteTimeData[i] / 128.0;
                const y = v * (canvas.height / 2);

                if (i === 0) {
                    canvasCtx.moveTo(x, y);
                } else {
                    canvasCtx.lineTo(x, y);
                }

                x += sliceWidth;
            }

            canvasCtx.lineTo(canvas.width, canvas.height / 2);
            canvasCtx.stroke();
        }
    </script>
</body>
</html>
