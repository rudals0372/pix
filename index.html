<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>정밀 주파수 측정기</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background: #121212; color: #fff; }
        .container { max-width: 650px; margin: 0 auto; background: #1e1e1e; padding: 20px; border-radius: 12px; }
        button { padding: 14px 28px; font-size: 16px; font-weight: bold; border: none; border-radius: 6px; background: #007bff; color: white; cursor: pointer; }
        button:disabled { background: #444; }
        .freq-card { background: #2a2a2a; padding: 15px; border-radius: 8px; margin: 20px 0; }
        .freq-display { font-size: 42px; font-weight: bold; color: #00ffcc; }
        #errorLog { color: #ff5555; font-size: 14px; margin-top: 10px; }
        canvas { width: 100%; height: 200px; background: #0d0d0d; border-radius: 8px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>실시간 주파수 분석기</h2>
        <button id="startBtn">측정 시작</button>
        <div id="errorLog"></div>
        
        <div class="freq-card">
            <div>측정된 주파수</div>
            <div class="freq-display"><span id="freqVal">0.0</span> Hz</div>
        </div>

        <canvas id="visualizer"></canvas>
    </div>

    <script>
        let audioCtx;
        let analyser;
        const canvas = document.getElementById("visualizer");
        const canvasCtx = canvas.getContext("2d");

        function logError(msg) {
            document.getElementById("errorLog").innerText = msg;
        }

        document.getElementById("startBtn").addEventListener("click", async () => {
            logError(""); // 에러 초기화
            
            // 1. AudioContext 상태 해제 (Safari/모바일 필수)
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                await audioCtx.resume();
            }

            // 2. 마이크 권한 요청
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 2048;

                const microphone = audioCtx.createMediaStreamSource(stream);
                microphone.connect(analyser);

                document.getElementById("startBtn").innerText = "측정 중...";
                document.getElementById("startBtn").disabled = true;

                canvas.width = canvas.clientWidth || 300;
                canvas.height = canvas.clientHeight || 200;

                draw();
            } catch (err) {
                logError("마이크 오류: " + err.name + " - " + err.message + "\n(HTTPS 환경이나 localhost에서 실행했는지 확인하세요)");
            }
        });

        // 실시간 FFT 피크 탐색 (안정성 강화)
        function getPitch(analyser, sampleRate) {
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            analyser.getByteFrequencyData(dataArray);

            let maxVal = -1;
            let maxIndex = -1;

            // 전체 대역 중 가장 강한 신호 탐색
            for (let i = 0; i < bufferLength; i++) {
                if (dataArray[i] > maxVal) {
                    maxVal = dataArray[i];
                    maxIndex = i;
                }
            }

            // 노이즈 임계값 미달 시 0 처리
            if (maxVal < 50) return 0;

            const nyquist = sampleRate / 2;
            const frequency = maxIndex * (nyquist / bufferLength);

            return frequency;
        }

        function draw() {
            requestAnimationFrame(draw);
            if (!analyser) return;

            const hz = getPitch(analyser, audioCtx.sampleRate);
            
            if (hz >= 20 && hz <= 15000) {
                document.getElementById("freqVal").innerText = hz.toFixed(1);
            } else {
                document.getElementById("freqVal").innerText = "0.0";
            }

            // 파형 그리기
            const timeData = new Uint8Array(analyser.fftSize);
            analyser.getByteTimeDomainData(timeData);

            canvasCtx.fillStyle = '#0d0d0d';
            canvasCtx.fillRect(0, 0, canvas.width, canvas.height);
            canvasCtx.lineWidth = 2;
            canvasCtx.strokeStyle = '#00ffcc';
            canvasCtx.beginPath();

            const sliceWidth = canvas.width / analyser.fftSize;
            let x = 0;

            for (let i = 0; i < analyser.fftSize; i++) {
                const v = timeData[i] / 128.0;
                const y = v * (canvas.height / 2);

                if (i === 0) canvasCtx.moveTo(x, y);
                else canvasCtx.lineTo(x, y);
                x += sliceWidth;
            }
            canvasCtx.stroke();
        }
    </script>
</body>
</html>
