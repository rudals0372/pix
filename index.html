<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자동폐색장치 주파수 진단기 (f1~f13 매핑)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 15px;
            background: #121212;
            color: #ffffff;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            background: #007bff;
            color: white;
            margin-bottom: 15px;
        }
        button:disabled { background: #444444; cursor: not-allowed; }

        /* 매핑 현황 현황판 Grid */
        .freq-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 8px;
            background: #181818;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid #333;
        }
        .freq-card-item {
            background: #252525;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #444;
            font-size: 12px;
            transition: all 0.2s;
        }
        .freq-card-item.active {
            background: #005826;
            border-color: #00ff66;
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.4);
        }
        .freq-card-item .name { font-weight: bold; font-size: 14px; color: #00ffcc; }
        .freq-card-item.active .name { color: #ffffff; }
        .freq-card-item .hz-val { font-size: 11px; color: #aaa; }
        .freq-card-item.active .hz-val { color: #e0e0e0; }

        canvas {
            width: 100%;
            height: 320px;
            background: #0d0d0d;
            border-radius: 8px;
            border: 1px solid #333;
            display: block;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>자동폐색장치 주파수(f1~f13) 분석기</h2>
        <button id="startBtn">측정 시작</button>
        
        <!-- 실시간 f1~f13 매핑 감지 뱃지 -->
        <div class="freq-grid" id="freqGrid"></div>

        <div style="text-align: left; font-size: 12px; color: #aaa; margin: 5px 0;">
            주파수 스펙트럼 (점선/영역: f1~f13 표준 허용범위 ±20Hz)
        </div>
        <canvas id="freqCanvas"></canvas>
    </div>

    <script>
        // 이미지 매뉴얼 표준 주파수 테이블 데이터 정의
        const FREQ_TABLE = [
            { id: 'f1',  tx: 'T701', rx: 'R701', target: 625 },
            { id: 'f2',  tx: 'T702', rx: 'R702', target: 875 },
            { id: 'f3',  tx: 'T703', rx: 'R703', target: 1125 },
            { id: 'f4',  tx: 'T704', rx: 'R704', target: 1375 },
            { id: 'f5',  tx: 'T705', rx: 'R705', target: 1625 },
            { id: 'f6',  tx: 'T706', rx: 'R706', target: 1875 },
            { id: 'f7',  tx: 'T707', rx: 'R707', target: 2125 },
            { id: 'f8',  tx: 'T708', rx: 'R708', target: 2375 },
            { id: 'f9',  tx: 'T709', rx: 'R509', target: 2625 },
            { id: 'f10', tx: 'T710', rx: 'R710', target: 3125 },
            { id: 'f11', tx: 'T711', rx: 'R711', target: 3625 },
            { id: 'f12', tx: 'T712', rx: 'R712', target: 4125 },
            { id: 'f13', tx: 'T713', rx: 'R713', target: 4625 }
        ];

        const TOLERANCE = 20; // 허용 오차 ±20Hz
        const DISPLAY_MAX_FREQ = 5000; // 그래프 표시 최대 주파수 (5kHz)

        let audioCtx;
        let analyser;
        const freqCanvas = document.getElementById("freqCanvas");
        const freqCtx = freqCanvas.getContext("2d");

        // UI 그리드 생성
        function initGrid() {
            const gridEl = document.getElementById("freqGrid");
            gridEl.innerHTML = "";
            FREQ_TABLE.forEach(item => {
                const card = document.createElement("div");
                card.className = "freq-card-item";
                card.id = `card-${item.id}`;
                card.innerHTML = `
                    <div class="name">${item.id}</div>
                    <div class="hz-val">${item.target}Hz</div>
                    <div style="font-size:9px; color:#777;">${item.tx}/${item.rx}</div>
                `;
                gridEl.appendChild(card);
            });
        }
        initGrid();

        function updateCanvasSize() {
            freqCanvas.width = freqCanvas.clientWidth;
            freqCanvas.height = freqCanvas.clientHeight;
        }

        document.getElementById("startBtn").addEventListener("click", async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } 
                });
                
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') await audioCtx.resume();

                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 4096; // 정밀한 주파수 분해능을 위해 4096 설정

                const microphone = audioCtx.createMediaStreamSource(stream);
                microphone.connect(analyser);

                document.getElementById("startBtn").innerText = "실시간 감지 중...";
                document.getElementById("startBtn").disabled = true;

                updateCanvasSize();
                draw();
            } catch (err) {
                alert("마이크 접근 실패: " + err);
            }
        });

        // 캔버스 배경에 f1~f13 가이드 라인 및 범주(±20Hz) 그리기
        function drawGuides(paddingLeft, graphWidth, graphHeight) {
            FREQ_TABLE.forEach(item => {
                const minHz = item.target - TOLERANCE;
                const maxHz = item.target + TOLERANCE;

                const xMin = paddingLeft + (minHz / DISPLAY_MAX_FREQ) * graphWidth;
                const xMax = paddingLeft + (maxHz / DISPLAY_MAX_FREQ) * graphWidth;
                const xCenter = paddingLeft + (item.target / DISPLAY_MAX_FREQ) * graphWidth;

                // 1. 허용 범주 수직 밴드 영역 (연한 녹색 배경)
                freqCtx.fillStyle = 'rgba(0, 255, 100, 0.12)';
                freqCtx.fillRect(xMin, 0, Math.max(2, xMax - xMin), graphHeight);

                // 2. 중심 Target 주파수 점선
                freqCtx.strokeStyle = 'rgba(0, 255, 200, 0.4)';
                freqCtx.lineWidth = 1;
                freqCtx.setLineDash([2, 4]);
                freqCtx.beginPath();
                freqCtx.moveTo(xCenter, 0);
                freqCtx.lineTo(xCenter, graphHeight);
                freqCtx.stroke();
                freqCtx.setLineDash([]); // Reset

                // 3. 상단 라벨 (f1, f2 ...)
                freqCtx.fillStyle = '#00ffcc';
                freqCtx.font = '10px monospace';
                freqCtx.fillText(item.id, xCenter - 6, 12);
            });
        }

        function drawGridAndAxes() {
            const paddingLeft = 40;
            const paddingBottom = 25;
            const graphWidth = freqCanvas.width - paddingLeft;
            const graphHeight = freqCanvas.height - paddingBottom;

            freqCtx.fillStyle = '#0d0d0d';
            freqCtx.fillRect(0, 0, freqCanvas.width, freqCanvas.height);

            // 축 및 눈금
            freqCtx.strokeStyle = '#222';
            freqCtx.fillStyle = '#777';
            freqCtx.font = '10px monospace';
            freqCtx.lineWidth = 1;

            // X축 (Hz 단위)
            for (let hz = 0; hz <= DISPLAY_MAX_FREQ; hz += 1000) {
                const xPos = paddingLeft + (hz / DISPLAY_MAX_FREQ) * graphWidth;
                freqCtx.beginPath();
                freqCtx.moveTo(xPos, 0);
                freqCtx.lineTo(xPos, graphHeight);
                freqCtx.stroke();
                freqCtx.fillText(`${hz / 1000}k`, xPos - 8, freqCanvas.height - 8);
            }

            // 축선
            freqCtx.strokeStyle = '#444';
            freqCtx.beginPath();
            freqCtx.moveTo(paddingLeft, 0);
            freqCtx.lineTo(paddingLeft, graphHeight);
            freqCtx.lineTo(freqCanvas.width, graphHeight);
            freqCtx.stroke();

            return { paddingLeft, graphHeight, graphWidth };
        }

        function draw() {
            requestAnimationFrame(draw);

            const { paddingLeft, graphHeight, graphWidth } = drawGridAndAxes();
            
            // 가이드라인 (f1~f13 영역) 그리기
            drawGuides(paddingLeft, graphWidth, graphHeight);

            let freqByteData = new Uint8Array(analyser.frequencyBinCount);
            analyser.getByteFrequencyData(freqByteData);

            const binResolution = (audioCtx.sampleRate / 2) / analyser.frequencyBinCount;
            const activeMap = {}; // 활성화된 f1~f13 판별용

            // 1. FFT 스펙트럼 그리기
            const totalBinsToDraw = Math.floor(DISPLAY_MAX_FREQ / binResolution);
            const barWidth = graphWidth / totalBinsToDraw;

            for (let i = 0; i < totalBinsToDraw; i++) {
                const currentHz = i * binResolution;
                const val = freqByteData[i];
                const barHeight = (val / 255) * graphHeight;
                const x = paddingLeft + (currentHz / DISPLAY_MAX_FREQ) * graphWidth;

                // 스펙트럼 막대 그리기
                if (val > 0) {
                    freqCtx.fillStyle = `hsl(${200 - (val / 255) * 160}, 100%, 50%)`;
                    freqCtx.fillRect(x, graphHeight - barHeight, Math.max(1.5, barWidth), barHeight);
                }

                // 2. 신호 감지 판별 (특정 문턱값 80 이상 감지 시 매핑)
                if (val > 80) {
                    FREQ_TABLE.forEach(item => {
                        if (currentHz >= (item.target - TOLERANCE) && currentHz <= (item.target + TOLERANCE)) {
                            activeMap[item.id] = true;
                        }
                    });
                }
            }

            // 3. 상단 f1~f13 카드 상태 갱신 (625Hz, 1625Hz 등이 들어오면 초록색 점등)
            FREQ_TABLE.forEach(item => {
                const cardEl = document.getElementById(`card-${item.id}`);
                if (activeMap[item.id]) {
                    cardEl.classList.add("active");
                } else {
                    cardEl.classList.remove("active");
                }
            });
        }

        window.addEventListener('resize', updateCanvasSize);
    </script>
</body>
</html>
