<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주파수 스펙트럼 진단기 (눈금 라벨 포함)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 20px;
            background: #121212;
            color: #ffffff;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        button {
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            background: #007bff;
            color: white;
            transition: background 0.2s;
            margin-bottom: 20px;
        }
        button:hover { background: #0056b3; }
        button:disabled { background: #444444; cursor: not-allowed; }
        
        .freq-card {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid #333;
        }
        .freq-display { font-size: 42px; font-weight: bold; color: #00ffcc; font-family: monospace; }
        
        .multi-freq-box {
            display: flex;
            justify-content: space-around;
            background: #181818;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #333;
        }
        .multi-freq-item { font-size: 14px; font-family: monospace; }
        .multi-freq-item span { font-weight: bold; color: #ffcc00; }

        canvas {
            width: 100%;
            height: 300px;
            background: #0d0d0d;
            border-radius: 8px;
            border: 1px solid #333;
            display: block;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>실시간 주파수 스펙트럼 분석기</h2>
        <button id="startBtn">측정 시작</button>
        
        <div class="freq-card">
            <div style="font-size: 14px; color: #aaa; margin-bottom: 5px;">대표 측정 주파수 (자가상관)</div>
            <div class="freq-display"><span id="freqVal">0.0</span> Hz</div>
        </div>

        <div class="multi-freq-box">
            <div class="multi-freq-item">1순위 피크: <span id="top1">0</span> Hz</div>
            <div class="multi-freq-item">2순위 피크: <span id="top2">0</span> Hz</div>
            <div class="multi-freq-item">3순위 피크: <span id="top3">0</span> Hz</div>
        </div>

        <div style="text-align: left; font-size: 12px; color: #aaa; margin: 5px 0;">주파수 스펙트럼 분포 (Horizontal: Hz / Vertical: Signal Level)</div>
        <canvas id="freqCanvas"></canvas>
    </div>

    <script>
        let audioCtx;
        let analyser;
        
        const freqCanvas = document.getElementById("freqCanvas");
        const freqCtx = freqCanvas.getContext("2d");

        function updateCanvasSize() {
            freqCanvas.width = freqCanvas.clientWidth;
            freqCanvas.height = freqCanvas.clientHeight;
        }

        document.getElementById("startBtn").addEventListener("click", async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { 
                        echoCancellation: false, 
                        noiseSuppression: false, 
                        autoGainControl: false 
                    } 
                });
                
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') await audioCtx.resume();

                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 2048;

                const microphone = audioCtx.createMediaStreamSource(stream);
                microphone.connect(analyser);

                document.getElementById("startBtn").innerText = "측정 중...";
                document.getElementById("startBtn").disabled = true;

                updateCanvasSize();
                draw();
            } catch (err) {
                alert("마이크 접근 실패: " + err);
            }
        });

        function autoCorrelate(buf, sampleRate) {
            let SIZE = buf.length;
            let rms = 0;

            for (let i = 0; i < SIZE; i++) {
                let val = buf[i];
                rms += val * val;
            }
            rms = Math.sqrt(rms / SIZE);
            if (rms < 0.001) return -1;

            let r1 = 0, r2 = SIZE - 1, thres = 0.2;
            for (let i = 0; i < SIZE / 2; i++) {
                if (Math.abs(buf[i]) < thres) { r1 = i; break; }
            }
            for (let i = 1; i < SIZE / 2; i++) {
                if (Math.abs(buf[SIZE - i]) < thres) { r2 = SIZE - i; break; }
            }

            buf = buf.slice(r1, r2);
            SIZE = buf.length;

            let c = new Float32Array(SIZE);
            for (let i = 0; i < SIZE; i++) {
                for (let j = 0; j < SIZE - i; j++) {
                    c[i] = c[i] + buf[j] * buf[j + i];
                }
            }

            let d = 0; 
            while (c[d] > c[d + 1]) d++;
            
            let maxval = -1, maxpos = -1;
            for (let i = d; i < SIZE; i++) {
                if (c[i] > maxval) {
                    maxval = c[i];
                    maxpos = i;
                }
            }
            let T0 = maxpos;

            let x1 = c[T0 - 1], x2 = c[T0], x3 = c[T0 + 1];
            let a = (x1 + x3 - 2 * x2) / 2;
            let b = (x3 - x1) / 2;
            if (a) T0 = T0 - b / (2 * a);

            return sampleRate / T0;
        }

        function getTopFrequencies(freqArray, sampleRate) {
            let peaks = [];
            const binSize = sampleRate / analyser.fftSize;

            for (let i = 2; i < freqArray.length - 2; i++) {
                if (freqArray[i] > 30 && freqArray[i] > freqArray[i - 1] && freqArray[i] > freqArray[i + 1]) {
                    peaks.push({
                        hz: Math.round(i * binSize),
                        val: freqArray[i]
                    });
                }
            }
            peaks.sort((a, b) => b.val - a.val);
            return peaks.slice(0, 3);
        }

        function drawGridAndAxes(sampleRate, maxFreq) {
            const paddingLeft = 45;
            const paddingBottom = 25;
            const graphWidth = freqCanvas.width - paddingLeft;
            const graphHeight = freqCanvas.height - paddingBottom;

            freqCtx.fillStyle = '#0d0d0d';
            freqCtx.fillRect(0, 0, freqCanvas.width, freqCanvas.height);

            freqCtx.strokeStyle = '#22332b';
            freqCtx.fillStyle = '#888888';
            freqCtx.font = '10px monospace';
            freqCtx.lineWidth = 1;

            // 1. 세로축 눈금 (신호 강도 %)
            const ySteps = [
                { text: '100%', y: 15 },
                { text: ' 50%', y: graphHeight / 2 },
                { text: '  0%', y: graphHeight }
            ];
            
            ySteps.forEach(step => {
                freqCtx.beginPath();
                freqCtx.moveTo(paddingLeft, step.y);
                freqCtx.lineTo(freqCanvas.width, step.y);
                freqCtx.stroke();
                freqCtx.fillText(step.text, 5, step.y + 3);
            });

            // 2. 가로축 눈금 (주파수 Hz)
            const xDivisions = 5;
            for (let i = 0; i <= xDivisions; i++) {
                const xPos = paddingLeft + (graphWidth / xDivisions) * i;
                const freqHz = Math.round((maxFreq / xDivisions) * i);
                let labelText = freqHz >= 1000 ? `${(freqHz / 1000).toFixed(1)}k` : `${freqHz}`;

                freqCtx.beginPath();
                freqCtx.moveTo(xPos, 0);
                freqCtx.lineTo(xPos, graphHeight);
                freqCtx.stroke();

                freqCtx.fillText(`${labelText}Hz`, xPos - 12, freqCanvas.height - 8);
            }

            // 축 메인 라인
            freqCtx.strokeStyle = '#444';
            freqCtx.beginPath();
            freqCtx.moveTo(paddingLeft, 0);
            freqCtx.lineTo(paddingLeft, graphHeight);
            freqCtx.lineTo(freqCanvas.width, graphHeight);
            freqCtx.stroke();

            return { paddingLeft, graphHeight, graphWidth };
        }

        function draw() {
            requestAnimationFrame(draw);

            let timeData = new Float32Array(analyser.fftSize);
            analyser.getFloatTimeDomainData(timeData);
            let preciseHz = autoCorrelate(timeData, audioCtx.sampleRate);
            
            if (preciseHz >= 20 && preciseHz <= 15000 && isFinite(preciseHz)) {
                document.getElementById("freqVal").innerText = preciseHz.toFixed(1);
            } else {
                document.getElementById("freqVal").innerText = "0.0";
            }

            let freqByteData = new Uint8Array(analyser.frequencyBinCount);
            analyser.getByteFrequencyData(freqByteData);
            
            let topPeaks = getTopFrequencies(freqByteData, audioCtx.sampleRate);
            document.getElementById("top1").innerText = topPeaks[0] ? topPeaks[0].hz : 0;
            document.getElementById("top2").innerText = topPeaks[1] ? topPeaks[1].hz : 0;
            document.getElementById("top3").innerText = topPeaks[2] ? topPeaks[2].hz : 0;

            // 시각화할 최대 주파수 범위 (Nyquist 절반 대역 기준: 약 5.5kHz까지 표시)
            const visibleBins = Math.floor(analyser.frequencyBinCount / 4); 
            const maxFreq = (audioCtx.sampleRate / 2) * (visibleBins / analyser.frequencyBinCount);

            const { paddingLeft, graphHeight, graphWidth } = drawGridAndAxes(audioCtx.sampleRate, maxFreq);

            const barWidth = graphWidth / visibleBins;
            let posX = paddingLeft;

            for (let i = 0; i < visibleBins; i++) {
                const barHeight = (freqByteData[i] / 255) * graphHeight;
                
                freqCtx.fillStyle = `hsl(${200 - (freqByteData[i] / 255) * 160}, 100%, 50%)`;
                freqCtx.fillRect(posX, graphHeight - barHeight, Math.max(1, barWidth - 1), barHeight);
                
                posX += barWidth;
            }
        }

        window.addEventListener('resize', updateCanvasSize);
    </script>
</body>
</html>
