<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>정밀 주파수 측정기 (20Hz ~ 15000Hz)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 20px;
            background: #121212;
            color: #ffffff;
        }
        .container {
            max-width: 650px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        button {
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            background: #007bff;
            color: white;
            transition: background 0.2s;
            margin-bottom: 20px;
        }
        button:hover { background: #0056b3; }
        button:disabled { background: #444444; cursor: not-allowed; }
        .freq-card {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #333;
        }
        .freq-title { font-size: 14px; color: #aaa; margin-bottom: 5px; }
        .freq-display { font-size: 42px; font-weight: bold; color: #00ffcc; }
        canvas {
            width: 100%;
            height: 220px;
            background: #0d0d0d;
            border-radius: 8px;
            border: 1px solid #333;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>실시간 정밀 주파수 분석기</h2>
        <button id="startBtn">측정 시작</button>
        
        <div class="freq-card">
            <div class="freq-title">측정된 주파수</div>
            <div class="freq-display"><span id="freqVal">0.0</span> Hz</div>
        </div>

        <div>
            <canvas id="visualizer"></canvas>
        </div>
    </div>

    <script>
        let audioCtx;
        let analyser;
        let microphone;
        let canvas = document.getElementById("visualizer");
        let canvasCtx = canvas.getContext("2d");

        // Canvas 크기 동적 맞춤
        function resizeCanvas() {
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);

        document.getElementById("startBtn").addEventListener("click", async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { 
                        echoCancellation: false, 
                        noiseSuppression: false, 
                        autoGainControl: false 
                    } 
                });
                
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                
                // 고주파 분해능 확보를 위해 4096 사용
                analyser.fftSize = 4096; 

                microphone = audioCtx.createMediaStreamSource(stream);
                microphone.connect(analyser);

                document.getElementById("startBtn").innerText = "측정 중...";
                document.getElementById("startBtn").disabled = true;

                resizeCanvas();
                draw();
            } catch (err) {
                alert("마이크 접근 실패: " + err);
            }
        });

        // Autocorrelation (자가상관) 분석 알고리즘
        function autoCorrelate(buf, sampleRate) {
            let SIZE = buf.length;
            let rms = 0;

            for (let i = 0; i < SIZE; i++) {
                let val = buf[i];
                rms += val * val;
            }
            rms = Math.sqrt(rms / SIZE);
            if (rms < 0.005) return -1; // 무음 및 미세 노이즈 차단

            // 20Hz ~ 15000Hz 범위에 상응하는 샘플 피치 탐색 범위
            let minLag = Math.floor(sampleRate / 15000); 
            let maxLag = Math.floor(sampleRate / 20);

            let bestLag = -1;
            let maxCorr = -1;

            for (let lag = minLag; lag <= maxLag; lag++) {
                let sum = 0;
                for (let i = 0; i < SIZE - lag; i++) {
                    sum += buf[i] * buf[i + lag];
                }
                if (sum > maxCorr) {
                    maxCorr = sum;
                    bestLag = lag;
                }
            }

            if (bestLag === -1 || maxCorr < 0.1) return -1;

            // 이차 보간법(Parabolic Interpolation) 적용하여 정밀도 보정
            let T0 = bestLag;
            if (T0 > 0 && T0 < SIZE - 1) {
                let x1 = 0, x2 = 0, x3 = 0;
                for (let i = 0; i < SIZE - T0; i++) {
                    x1 += buf[i] * buf[i + T0 - 1];
                    x2 += buf[i] * buf[i + T0];
                    x3 += buf[i] * buf[i + T0 + 1];
                }
                let a = (x1 + x3 - 2 * x2) / 2;
                let b = (x3 - x1) / 2;
                if (a !== 0) T0 = T0 - b / (2 * a);
            }

            return sampleRate / T0;
        }

        function draw() {
            requestAnimationFrame(draw);

            let timeData = new Float32Array(analyser.fftSize);
            analyser.getFloatTimeDomainData(timeData);
            
            let preciseHz = autoCorrelate(timeData, audioCtx.sampleRate);
            
            // 20Hz ~ 15,000Hz 유효 범위 내 값만 표시
            if (preciseHz >= 20 && preciseHz <= 15000 && isFinite(preciseHz)) {
                document.getElementById("freqVal").innerText = preciseHz.toFixed(1);
            } else {
                document.getElementById("freqVal").innerText = "0.0";
            }

            // 실시간 Waveform 캔버스 그리기
            let byteTimeData = new Uint8Array(analyser.fftSize);
            analyser.getByteTimeDomainData(byteTimeData);

            canvasCtx.fillStyle = '#0d0d0d';
            canvasCtx.fillRect(0, 0, canvas.width, canvas.height);

            canvasCtx.lineWidth = 2;
            canvasCtx.strokeStyle = '#00ffcc';
            canvasCtx.beginPath();

            const sliceWidth = canvas.width * 1.0 / analyser.fftSize;
            let x = 0;

            for (let i = 0; i < analyser.fftSize; i++) {
                const v = byteTimeData[i] / 128.0;
                const y = v * (canvas.height / 2);

                if (i === 0) canvasCtx.moveTo(x, y);
                else canvasCtx.lineTo(x, y);

                x += sliceWidth;
            }

            canvasCtx.lineTo(canvas.width, canvas.height / 2);
            canvasCtx.stroke();
        }
    </script>
</body>
</html>
