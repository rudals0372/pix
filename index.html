<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마이크 주파수 측정기</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background: #121212; color: #fff; }
        button { padding: 12px 24px; font-size: 16px; cursor: pointer; border: none; border-radius: 5px; background: #007bff; color: white; margin-bottom: 20px; }
        button:hover { background: #0056b3; }
        canvas { width: 100%; max-width: 600px; height: 200px; background: #222; border-radius: 8px; }
        .info { margin-top: 15px; font-size: 18px; color: #00ffcc; }
    </style>
</head>
<body>

    <h2>실시간 마이크 주파수 측정</h2>
    <button id="startBtn">마이크 시작</button>
    
    <div>
        <canvas id="visualizer"></canvas>
    </div>
    
    <div class="info">
        현재 최대 볼륨 레벨: <span id="volume">0</span>
    </div>

    <script>
        let audioCtx;
        let analyser;
        let microphone;
        let dataArray;
        let canvas = document.getElementById("visualizer");
        let canvasCtx = canvas.getContext("2d");

        document.getElementById("startBtn").addEventListener("click", async () => {
            // 마이크 권한 요청 및 AudioContext 생성 (인터넷 미연결 상태에서도 작동)
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 256; // 주파수 분석 해상도 설정

                microphone = audioCtx.createMediaStreamSource(stream);
                microphone.connect(analyser);

                const bufferLength = analyser.frequencyBinCount;
                dataArray = new Uint8Array(bufferLength);

                document.getElementById("startBtn").innerText = "측정 중...";
                document.getElementById("startBtn").disabled = true;

                draw();
            } catch (err) {
                alert("마이크 접근에 실패했습니다: " + err);
            }
        });

        // 캔버스에 시각화 그래프 그리기 (반복 실행)
        function draw() {
            requestAnimationFrame(draw);

            analyser.getByteFrequencyData(dataArray);

            // 배경 그리기
            canvasCtx.fillStyle = '#222';
            canvasCtx.fillRect(0, 0, canvas.width, canvas.height);

            const barWidth = (canvas.width / dataArray.length) * 2.5;
            let barHeight;
            let x = 0;
            let maxVol = 0;

            for (let i = 0; i < dataArray.length; i++) {
                barHeight = dataArray[i];
                if (barHeight > maxVol) maxVol = barHeight;

                // 주파수 그래프 막대 스타일
                canvasCtx.fillStyle = `rgb(${barHeight + 100}, 50, 250)`;
                canvasCtx.fillRect(x, canvas.height - barHeight / 2, barWidth, barHeight / 2);

                x += barWidth + 1;
            }

            // 실시간 수치 업데이트
            document.getElementById("volume").innerText = maxVol;
        }
    </script>
</body>
</html>
