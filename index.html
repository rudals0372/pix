<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게임 정산기</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f6f8;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 100%;
        }
        h1, h2 {
            text-align: center;
            color: #333;
        }
        .step {
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #45a049;
        }
        .hidden {
            display: none;
        }
        .player-input-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        .player-input-group span {
            width: 80px;
            font-weight: bold;
        }
        .result-card {
            background: #eef9f1;
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
            border-left: 5px solid #4CAF50;
        }
        .result-item {
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            margin: 8px 0;
        }
        .positive { color: #2e7d32; font-weight: bold; }
        .negative { color: #c62828; font-weight: bold; }
        .zero { color: #555; }
    </style>
</head>
<body>

<div class="container">
    <h1>🎮 게임 정산기</h1>

    <!-- 1단계: 설정 입력 -->
    <div id="step-setup" class="step">
        <h2>1. 게임 기본 설정</h2>
        <div class="form-group">
            <label for="playerCount">참가 인원 수 (명):</label>
            <input type="number" id="playerCount" min="2" placeholder="예: 4" value="4">
        </div>
        <div class="form-group">
            <label for="totalRounds">총 게임 판수:</label>
            <input type="number" id="totalRounds" min="1" placeholder="예: 5" value="5">
        </div>
        <button onclick="setupGame()">다음 단계로</button>
    </div>

    <!-- 2단계: 패배 횟수 & 기준 금액 N 입력 -->
    <div id="step-input" class="step hidden">
        <h2>2. 기록 및 금액 설정</h2>
        <div id="playerInputs"></div>
        <hr style="margin: 20px 0; border: none; border-top: 1px dashed #ccc;">
        <div class="form-group">
            <label for="unitAmount">1회 패배 시 줄 금액 (N원):</label>
            <input type="number" id="unitAmount" min="0" placeholder="예: 1000" value="1000">
        </div>
        <button onclick="calculateResults()">최종 금액 계산하기</button>
    </div>

    <!-- 3단계: 정산 결과 -->
    <div id="step-result" class="step hidden">
        <h2>3. 최종 정산 결과</h2>
        <div id="resultContainer"></div>
        <button onclick="resetGame()" style="background-color: #777; margin-top: 15px;">처음부터 다시하기</button>
    </div>
</div>

<script>
    let players = [];
    let rounds = 0;

    // 게임 세팅
    function setupGame() {
        const countInput = document.getElementById('playerCount').value;
        const roundInput = document.getElementById('totalRounds').value;

        const count = parseInt(countInput);
        rounds = parseInt(roundInput);

        if (!count || count < 2) {
            alert('인원 수는 최소 2명 이상이어야 합니다.');
            return;
        }
        if (!rounds || rounds < 1) {
            alert('판수는 최소 1판 이상이어야 합니다.');
            return;
        }

        const inputContainer = document.getElementById('playerInputs');
        inputContainer.innerHTML = '';

        for (let i = 1; i <= count; i++) {
            const div = document.createElement('div');
            div.className = 'player-input-group';
            div.innerHTML = `
                <span>플레이어 ${i}</span>
                <input type="number" class="loss-input" min="0" max="${rounds}" placeholder="패배 횟수" value="0"> 판 패
            `;
            inputContainer.appendChild(div);
        }

        document.getElementById('step-setup').classList.add('hidden');
        document.getElementById('step-input').classList.remove('hidden');
    }

    // 결과 계산
    function calculateResults() {
        const lossInputs = document.querySelectorAll('.loss-input');
        const unitAmount = parseInt(document.getElementById('unitAmount').value);

        if (isNaN(unitAmount) || unitAmount < 0) {
            alert('올바른 금액(N)을 입력해 주세요.');
            return;
        }

        const totalPlayers = lossInputs.length;
        let totalLosses = 0;
        const losses = [];

        lossInputs.forEach(input => {
            const val = parseInt(input.value) || 0;
            losses.push(val);
            totalLosses += val;
        });

        // 결과 계산 방식:
        // 한 번 질 때마다 나머지 (totalPlayers - 1) 명에게 각각 N원씩 줌 -> 총 손실: 패배수 * (인원수 - 1) * N
        // 남이 질 때마다 1번당 N원씩 받음 -> 총 획득: (전체 패배수 - 내 패배수) * N
        // 최종 금액 = 획득 - 손실 = (전체 패배수 - 내 패배수 * 인원수) * N

        const resultContainer = document.getElementById('resultContainer');
        resultContainer.innerHTML = '';

        losses.forEach((lossCount, index) => {
            const finalAmount = (totalLosses - (lossCount * totalPlayers)) * unitAmount;

            let amountClass = 'zero';
            let amountText = '0 원';

            if (finalAmount > 0) {
                amountClass = 'positive';
                amountText = `+${finalAmount.toLocaleString()} 원 (받을 돈)`;
            } else if (finalAmount < 0) {
                amountClass = 'negative';
                amountText = `${finalAmount.toLocaleString()} 원 (낼 돈)`;
            }

            const card = document.createElement('div');
            card.className = 'result-card';
            card.innerHTML = `
                <div class="result-item">
                    <span><strong>플레이어 ${index + 1}</strong> (${lossCount}패)</span>
                    <span class="${amountClass}">${amountText}</span>
                </div>
            `;
            resultContainer.appendChild(card);
        });

        document.getElementById('step-result').classList.remove('hidden');
    }

    // 리셋
    function resetGame() {
        document.getElementById('step-result').classList.add('hidden');
        document.getElementById('step-input').classList.add('hidden');
        document.getElementById('step-setup').classList.remove('hidden');
    }
</script>

</body>
</html>
