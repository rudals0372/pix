<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>정밀 주파수 측정기</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 20px;
            background: #121212;
            color: #ffffff;
        }
        .container {
            max-width: 650px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        button {
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            background: #007bff;
            color: white;
            transition: background 0.2s;
            margin-bottom: 20px;
        }
        button:hover { background: #0056b3; }
        button:disabled { background: #444444; cursor: not-allowed; }
        .freq-card {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #333;
        }
        .freq-title { font-size: 14px; color: #aaa; margin-bottom: 5px; }
        .freq-display { font-size: 42px; font-weight: bold; color: #00ffcc; }
        canvas {
            width: 100%;
            height: 220px;
            background: #0d0d0d;
            border-radius: 8px;
            border: 1px solid #333;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>실시간 정밀 주파수(Hz) 분석기</h2>
        <button id="startBtn">측정 시작</button>
        
        <div class="freq-card">
            <div class="freq-title">측정된 주파수</div>
            <div class="freq-display"><span id="freqVal">0.0</span> Hz</div>
        </div>

        <div>
            <canvas id="visualizer"></canvas>
        </div>
    </div>

    <script>
        let audioCtx;
        let analyser;
        let microphone;
        let canvas = document.getElementById("visualizer");
        let canvasCtx = canvas.getContext("2d");

        document.getElementById("startBtn").addEventListener("click", async () => {
            try {
                // 하드웨어 필터링(에코/노이즈 제거 등)을 모두 꺼서 회로의 원본 신호를 수집
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { 
                        echoCancellation: false, 
                        noiseSuppression: false, 
                        autoGainControl: false 
                    } 
                });
                
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                
                // 샘플 수율 확보를 위해 FFT Size 확장
                analyser.fftSize = 2048; 

                microphone = audioCtx.createMediaStreamSource(stream);
                microphone.connect(analyser);

                document.getElementById("startBtn").innerText = "측정 중...";
                document.getElementById("startBtn").disabled = true;

                draw();
            } catch (err) {
                alert("마이크 접근 실패: " + err);
            }
        });

        // Autocorrelation(자기상관) + 포물선 보간법 알고리즘
        function autoCorrelate(buf, sampleRate) {
            let SIZE = buf.length;
            let rms = 0;

            // RMS(신호 전력) 계산으로 노이즈 차단
            for (let i = 0; i < SIZE; i++) {
                let val = buf[i];
                rms += val * val;
            }
            rms = Math.sqrt(rms / SIZE);
            if (rms < 0.01) return -1; // 입력 신호가 너무 작으면 측정하지 않음

            let r1 = 0, r2 = SIZE - 1, thres = 0.2;
            for (let i = 0; i < SIZE / 2; i++) {
                if (Math.abs(buf[i]) < thres) { r1 = i; break; }
            }
            for (let i = 1; i < SIZE / 2; i++) {
                if (Math.abs(buf[SIZE - i]) < thres) { r2 = SIZE - i; break; }
            }

            buf = buf.slice(r1, r2);
            SIZE = buf.length;

            let c = new Float32Array(SIZE);
            for (let i = 0; i < SIZE; i++) {
                for (let j = 0; j < SIZE - i; j++) {
                    c[i] = c[i] + buf[j] * buf[j + i];
                }
            }

            let d = 0; 
            while (c[d] > c[d + 1]) d++;
            
            let maxval = -1, maxpos = -1;
            for (let i = d; i < SIZE; i++) {
                if (c[i] > maxval) {
                    maxval = c[i];
                    maxpos = i;
                }
            }
            let T0 = maxpos;

            // 포물선 보간법으로 소수점 정밀도 보정
            let x1 = c[T0 - 1], x2 = c[T0], x3 = c[T0 + 1];
            let a = (x1 + x3 - 2 * x2) / 2;
            let b = (x3 - x1) / 2;
            if (a) T0 = T0 - b / (2 * a);

            return sampleRate / T0;
        }

        function draw() {
            requestAnimationFrame(draw);

            // 1. 시간 영역 데이터 추출 및 소수점 Hz 계산
            let timeData = new Float32Array(analyser.fftSize);
            analyser.getFloatTimeDomainData(timeData);
            
            let preciseHz = autoCorrelate(timeData, audioCtx.sampleRate);
            
            if (preciseHz !== -1 && isFinite(preciseHz)) {
                document.getElementById("freqVal").innerText = preciseHz.toFixed(1);
            } else {
                document.getElementById("freqVal").innerText = "0.0";
            }

            // 2. 주파수 스펙트럼 실시간 그래프 그리기
            let byteData = new Uint8Array(analyser.frequencyBinCount);
            analyser.getByteFrequencyData(byteData);

            canvasCtx.fillStyle = '#0d0d0d';
            canvasCtx.fillRect(0, 0, canvas.width, canvas.height);

            const barWidth = (canvas.width / byteData.length) * 2.5;
            let x = 0;

            for (let i = 0; i < byteData.length; i++) {
                const barHeight = byteData[i];
                
                // 주파수 영역별 무지개 색상 표현
                canvasCtx.fillStyle = `hsl(${(i / byteData.length) * 300}, 100%, 50%)`;
                canvasCtx.fillRect(x, canvas.height - (barHeight / 255 * canvas.height), barWidth, canvas.height);

                x += barWidth + 1;
            }
        }
    </script>
</body>
</html>
