<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>자동폐색장치 주파수 수신기</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0f172a',
                        cardBg: '#1e293b'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body class="bg-darkBg text-slate-100 min-h-screen flex flex-col justify-between select-none">

    <!-- Header Section -->
    <header class="bg-slate-900 border-b border-slate-800 p-3 sm:p-4 sticky top-0 z-50 shadow-md">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center text-white text-xl font-bold shadow-lg">
                    <i class="fa-solid fa-wave-square"></i>
                </div>
                <div>
                    <h1 class="text-base sm:text-lg font-bold text-slate-100 leading-tight">자동폐색장치 주파수 수신기</h1>
                </div>
            </div>
            <!-- Receiver Power Toggle Button -->
            <button id="toggleBtn" class="px-4 py-2 rounded-xl font-bold text-xs sm:text-sm bg-blue-600 hover:bg-blue-500 active:scale-95 text-white transition-all shadow-md flex items-center gap-2">
                <i class="fa-solid fa-power-off" id="btnIcon"></i>
                <span id="btnText">수신 시작</span>
            </button>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-4xl w-full mx-auto p-3 sm:p-5 flex-1 flex flex-col gap-4">

        <!-- Waveform Viewer & Real-time Signal Stats -->
        <div class="bg-cardBg border border-slate-700/60 rounded-2xl p-3 sm:p-4 shadow-xl flex flex-col gap-3">
            
            <!-- Target Channel Display Header -->
            <div class="flex items-center justify-between px-1">
                <div class="flex items-center gap-2">
                    <span id="targetBadge" class="px-2.5 py-1 rounded-lg bg-indigo-500/20 text-indigo-300 border border-indigo-500/40 text-xs font-bold">
                        전체 스펙트럼 관측 모드
                    </span>
                    <span id="txrxLabel" class="text-xs font-mono text-slate-400"></span>
                </div>
                <button id="resetViewBtn" onclick="selectChannel(null)" class="hidden text-[11px] px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-cyan-400 border border-cyan-500/30 transition-all font-semibold">
                    <i class="fa-solid fa-chart-simple mr-1"></i>전체 스펙트럼 보기
                </button>
            </div>

            <!-- Waveform / Spectrum Canvas Box -->
            <div class="relative w-full h-56 sm:h-64 bg-slate-950 rounded-xl border border-slate-800 overflow-hidden">
                <canvas id="freqCanvas"></canvas>
                
                <!-- Grid Center Guide Lines Overlay -->
                <div class="absolute inset-0 pointer-events-none flex items-center justify-center">
                    <div class="w-full border-b border-cyan-500/10 border-dashed"></div>
                </div>

                <!-- Signal Status Overlay -->
                <div id="statusOverlay" class="absolute top-3 right-3 px-3 py-1.5 rounded-lg bg-slate-900/80 border border-slate-700 text-xs font-bold text-slate-400 flex items-center gap-2 backdrop-blur-sm">
                    <span id="statusDot" class="w-2 h-2 rounded-full bg-slate-500"></span>
                    <span id="statusText">대기 중</span>
                </div>
            </div>

            <!-- Receiver Sensitivity (Gain) Control Slider & Peak Display -->
            <div class="flex flex-col sm:flex-row justify-between items-center gap-2 text-[11px] text-slate-400 px-1 bg-slate-900/50 p-2.5 rounded-xl border border-slate-800/80">
                <div class="flex items-center gap-3 w-full sm:w-auto">
                    <i class="fa-solid fa-sliders text-cyan-400"></i>
                    <span class="text-xs text-slate-300 font-bold whitespace-nowrap">수신 감도(증폭)</span>
                    <input type="range" id="gainSlider" min="10" max="30" value="15" class="w-full sm:w-32 h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-cyan-400">
                    <span id="gainVal" class="text-xs font-mono text-cyan-400 font-bold w-10">1.5x</span>
                </div>
                <div class="flex items-center justify-between sm:justify-end w-full sm:w-auto gap-4">
                    <span id="measuredHzText" class="font-mono text-emerald-400 font-bold text-xs whitespace-nowrap">-- Hz</span>
                </div>
            </div>
        </div>

        <!-- 14 Channel Grid (5 Cols 3 Rows) -->
        <div class="bg-cardBg border border-slate-700/60 rounded-2xl p-3 sm:p-4 shadow-xl">
            <div class="grid grid-cols-5 gap-1.5 sm:gap-2" id="freqGrid">
                <!-- 14 Frequency Cards render dynamically here -->
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center py-3 text-slate-500 text-[11px] border-t border-slate-800/80">
        자동폐색장치 주파수 수신기 &copy; 2026
    </footer>

    <script>
        // 14 Channels Table Definition
        const FREQ_TABLE = [
            { id: 'f1',  tx: 'T701', rx: 'R701', target: 625 },
            { id: 'f2',  tx: 'T702', rx: 'R702', target: 875 },
            { id: 'f3',  tx: 'T703', rx: 'R703', target: 1125 },
            { id: 'f4',  tx: 'T704', rx: 'R704', target: 1375 },
            { id: 'f5',  tx: 'T705', rx: 'R705', target: 1625 },
            { id: 'f6',  tx: 'T706', rx: 'R706', target: 1875 },
            { id: 'f7',  tx: 'T707', rx: 'R707', target: 2125 },
            { id: 'f8',  tx: 'T708', rx: 'R708', target: 2375 },
            { id: 'f9',  tx: 'T709', rx: 'R709', target: 2625 },
            { id: 'f10', tx: 'T710', rx: 'R710', target: 3125 },
            { id: 'f11', tx: 'T711', rx: 'R711', target: 3625 },
            { id: 'f12', tx: 'T712', rx: 'R712', target: 4125 },
            { id: 'f13', tx: 'T713', rx: 'R713', target: 4625 },
            { id: 'f14', tx: 'T714', rx: 'R714', target: 7125 }
        ];

        const TOLERANCE = 30;
        let selectedChannel = null;

        let audioCtx = null;
        let analyser = null;
        let mediaStream = null;
        let microphoneNode = null;
        let animationFrameId = null;
        let isMeasuring = false;

        // Peak variables definition
        let overallPeakHz = 0;
        let overallPeakTimer = 0;
        const channelPeakHold = {};

        // Exponential Moving Average (EMA) smoothed levels for stable yet responsive metering
        const smoothedLevels = {};

        FREQ_TABLE.forEach(item => {
            smoothedLevels[item.id] = 0;
            channelPeakHold[item.id] = 0;
        });

        // Gain Multiplier
        let gainMultiplier = 1.5;

        // DOM elements
        const toggleBtn = document.getElementById("toggleBtn");
        const btnText = document.getElementById("btnText");
        const btnIcon = document.getElementById("btnIcon");
        const freqCanvas = document.getElementById("freqCanvas");
        const freqCtx = freqCanvas.getContext("2d");

        const targetBadge = document.getElementById("targetBadge");
        const txrxLabel = document.getElementById("txrxLabel");
        const resetViewBtn = document.getElementById("resetViewBtn");
        const measuredHzText = document.getElementById("measuredHzText");
        const statusDot = document.getElementById("statusDot");
        const statusText = document.getElementById("statusText");

        const gainSlider = document.getElementById("gainSlider");
        const gainVal = document.getElementById("gainVal");

        gainSlider.addEventListener("input", (e) => {
            gainMultiplier = parseFloat(e.target.value) / 10;
            gainVal.innerText = `${gainMultiplier.toFixed(1)}x`;
        });

        function initGrid() {
            const gridEl = document.getElementById("freqGrid");
            gridEl.innerHTML = "";

            FREQ_TABLE.forEach((item) => {
                const btn = document.createElement("button");
                btn.id = `card-${item.id}`;
                btn.className = `p-2 rounded-xl border text-left transition-all duration-200 flex flex-col justify-between min-h-[68px] relative overflow-hidden bg-slate-900 border-slate-800 hover:border-slate-700`;

                btn.onclick = () => selectChannel(item);

                btn.innerHTML = `
                    <div class="flex items-center justify-between w-full">
                        <span id="name-${item.id}" class="font-bold text-xs text-slate-300">${item.id}</span>
                        <span class="text-[9px] font-mono text-slate-500">${item.target}Hz</span>
                    </div>
                    <div class="text-[9px] text-slate-500 font-mono">${item.tx}/${item.rx}</div>
                    
                    <div class="w-full bg-slate-950 h-1 rounded-full mt-1 overflow-hidden">
                        <div id="bar-${item.id}" class="h-full w-0 bg-slate-700 transition-all duration-150"></div>
                    </div>
                `;
                gridEl.appendChild(btn);
            });
        }

        // Select channel
        function selectChannel(item) {
            selectedChannel = item;
            
            if (item) {
                targetBadge.innerText = `${item.id} (${item.target}Hz) 선택됨`;
                targetBadge.className = "px-2.5 py-1 rounded-lg bg-cyan-500/20 text-cyan-300 border border-cyan-500/40 text-xs font-bold";
                txrxLabel.innerText = "";
                resetViewBtn.classList.remove("hidden");
            } else {
                targetBadge.innerText = `전체 스펙트럼 관측 모드`;
                targetBadge.className = "px-2.5 py-1 rounded-lg bg-indigo-500/20 text-indigo-300 border border-indigo-500/40 text-xs font-bold";
                txrxLabel.innerText = "";
                resetViewBtn.classList.add("hidden");
            }
            
            FREQ_TABLE.forEach(i => {
                const card = document.getElementById(`card-${i.id}`);
                if (card) {
                    if (selectedChannel && i.id === selectedChannel.id) {
                        card.classList.add("ring-2", "ring-cyan-400");
                    } else {
                        card.classList.remove("ring-2", "ring-cyan-400");
                    }
                }
            });
        }

        function updateCanvasSize() {
            const dpr = window.devicePixelRatio || 1;
            const rect = freqCanvas.getBoundingClientRect();
            freqCanvas.width = rect.width * dpr;
            freqCanvas.height = rect.height * dpr;
            freqCtx.scale(dpr, dpr);
        }

        toggleBtn.addEventListener("click", async () => {
            if (!isMeasuring) {
                await startMeasurement();
            } else {
                stopMeasurement();
            }
        });

        async function startMeasurement() {
            try {
                // C타입 디지털 젠더 및 브라우저의 오디오 압축/보정 알고리즘 완전 차단 설정
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: false,
                        noiseSuppression: false,
                        autoGainControl: false,
                        channelCount: 1,
                        sampleRate: 44100,
                        sampleSize: 16
                    }
                });

                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') {
                    await audioCtx.resume();
                }

                const highPassFilter = audioCtx.createBiquadFilter();
                highPassFilter.type = 'highpass';
                highPassFilter.frequency.setValueAtTime(80, audioCtx.currentTime);

                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 4096;
                analyser.smoothingTimeConstant = 0.80; // 반응 속도를 조금 더 빠르게 조절

                microphoneNode = audioCtx.createMediaStreamSource(mediaStream);
                
                microphoneNode.connect(highPassFilter);
                highPassFilter.connect(analyser);

                isMeasuring = true;
                btnText.innerText = "수신 중지";
                btnIcon.className = "fa-solid fa-stop text-rose-400";
                toggleBtn.className = "px-4 py-2 rounded-xl font-bold text-xs sm:text-sm bg-rose-600 hover:bg-rose-500 active:scale-95 text-white transition-all shadow-md flex items-center gap-2";

                updateCanvasSize();
                draw();
            } catch (err) {
                alert("마이크/라인 입력 권한 오류: " + err.message);
            }
        }

        function stopMeasurement() {
            isMeasuring = false;

            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
                animationFrameId = null;
            }

            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
            }

            if (audioCtx) {
                audioCtx.close();
                audioCtx = null;
            }

            btnText.innerText = "수신 시작";
            btnIcon.className = "fa-solid fa-power-off";
            toggleBtn.className = "px-4 py-2 rounded-xl font-bold text-xs sm:text-sm bg-blue-600 hover:bg-blue-500 active:scale-95 text-white transition-all shadow-md flex items-center gap-2";

            measuredHzText.innerText = "-- Hz";
            statusDot.className = "w-2 h-2 rounded-full bg-slate-500";
            statusText.innerText = "대기 중";

            FREQ_TABLE.forEach(item => {
                const bar = document.getElementById(`bar-${item.id}`);
                const card = document.getElementById(`card-${item.id}`);
                const name = document.getElementById(`name-${item.id}`);
                if (bar) bar.style.width = "0%";
                if (card) {
                    card.className = "p-2 rounded-xl border text-left transition-all duration-200 flex flex-col justify-between min-h-[68px] relative overflow-hidden bg-slate-900 border-slate-800 hover:border-slate-700";
                }
                if (name) name.className = "font-bold text-xs text-slate-300";
                channelPeakHold[item.id] = 0;
            });

            drawEmptyGrid();
        }

        function drawEmptyGrid() {
            const rect = freqCanvas.getBoundingClientRect();
            freqCtx.clearRect(0, 0, rect.width, rect.height);
            freqCtx.strokeStyle = '#1e293b';
            freqCtx.lineWidth = 1;

            freqCtx.beginPath();
            freqCtx.moveTo(0, rect.height / 2);
            freqCtx.lineTo(rect.width, rect.height / 2);
            freqCtx.stroke();
        }

        function draw() {
            if (!isMeasuring) return;

            animationFrameId = requestAnimationFrame(draw);

            const rect = freqCanvas.getBoundingClientRect();
            const width = rect.width;
            const height = rect.height;

            const freqData = new Uint8Array(analyser.frequencyBinCount);
            analyser.getByteFrequencyData(freqData);

            const binResolution = (audioCtx.sampleRate / 2) / analyser.frequencyBinCount;

            freqCtx.fillStyle = '#020617';
            freqCtx.fillRect(0, 0, width, height);

            // Background Grid Lines
            freqCtx.strokeStyle = '#0f172a';
            freqCtx.lineWidth = 1;
            for (let x = 0; x < width; x += 30) {
                freqCtx.beginPath();
                freqCtx.moveTo(x, 0);
                freqCtx.lineTo(x, height);
                freqCtx.stroke();
            }
            for (let y = 0; y < height; y += 30) {
                freqCtx.beginPath();
                freqCtx.moveTo(0, y);
                freqCtx.lineTo(width, y);
                freqCtx.stroke();
            }

            let activeCount = 0;
            const now = Date.now();

            FREQ_TABLE.forEach(item => {
                const minHz = item.target - TOLERANCE;
                const maxHz = item.target + TOLERANCE;
                const startBin = Math.floor(minHz / binResolution);
                const endBin = Math.ceil(maxHz / binResolution);

                let channelMax = 0;
                for (let b = startBin; b <= endBin; b++) {
                    if (freqData[b] > channelMax) channelMax = freqData[b];
                }

                // C타입 젠더 수신율 개선을 위한 기본 증폭 보정 계수(1.6배) 적용
                const cTypeBoost = 1.6;
                let amplifiedVal = Math.min(255, channelMax * gainMultiplier * cTypeBoost);
                let instantPct = Math.round((amplifiedVal / 255) * 100);

                if (instantPct < 8) instantPct = 0;

                // EMA 필터링 계산
                if (smoothedLevels[item.id] === undefined) {
                    smoothedLevels[item.id] = 0;
                }
                
                // 값이 올라갈 때는 빠르게, 내려갈 때는 부드럽게 반응하도록 설정
                const alpha = instantPct > smoothedLevels[item.id] ? 0.6 : 0.2;
                smoothedLevels[item.id] = smoothedLevels[item.id] + alpha * (instantPct - smoothedLevels[item.id]);

                const levelPct = Math.round(smoothedLevels[item.id]);

                const card = document.getElementById(`card-${item.id}`);
                const bar = document.getElementById(`bar-${item.id}`);
                const name = document.getElementById(`name-${item.id}`);

                if (bar) bar.style.width = `${levelPct}%`;

                const SIGNAL_GREEN_THRESHOLD = 30;
                const SIGNAL_AMBER_THRESHOLD = 15;

                if (levelPct >= SIGNAL_GREEN_THRESHOLD) {
                    activeCount++;
                    if (card) {
                        card.className = `p-2 rounded-xl border text-left transition-all duration-200 flex flex-col justify-between min-h-[68px] relative overflow-hidden bg-emerald-950/80 border-emerald-500 shadow-[0_0_12px_rgba(16,185,129,0.35)] ${selectedChannel && selectedChannel.id === item.id ? 'ring-2 ring-cyan-400' : ''}`;
                    }
                    if (name) name.className = "font-bold text-xs text-emerald-300";
                    if (bar) bar.className = "h-full bg-emerald-400 transition-all duration-150";
                } else if (levelPct >= SIGNAL_AMBER_THRESHOLD) {
                    if (card) {
                        card.className = `p-2 rounded-xl border text-left transition-all duration-200 flex flex-col justify-between min-h-[68px] relative overflow-hidden bg-amber-950/40 border-amber-500/60 ${selectedChannel && selectedChannel.id === item.id ? 'ring-2 ring-cyan-400' : ''}`;
                    }
                    if (name) name.className = "font-bold text-xs text-amber-300";
                    if (bar) bar.className = "h-full bg-amber-400 transition-all duration-150";
                } else {
                    if (card) {
                        card.className = `p-2 rounded-xl border text-left transition-all duration-200 flex flex-col justify-between min-h-[68px] relative overflow-hidden bg-slate-900 border-slate-800 hover:border-slate-700 ${selectedChannel && selectedChannel.id === item.id ? 'ring-2 ring-cyan-400' : ''}`;
                    }
                    if (name) name.className = "font-bold text-xs text-slate-300";
                    if (bar) bar.className = "h-full bg-slate-700 transition-all duration-150";
                }
            });

            // Update Peak Display Hz
            let maxBin = 0, maxVal = 0;
            for (let i = 0; i < freqData.length; i++) {
                if (freqData[i] > maxVal) {
                    maxVal = freqData[i];
                    maxBin = i;
                }
            }
            const currentPeakHz = Math.round(maxBin * binResolution);

            if (maxVal > 25) {
                overallPeakHz = currentPeakHz;
                overallPeakTimer = now + 1000;
            }

            if (now < overallPeakTimer && overallPeakHz > 0) {
                measuredHzText.innerText = `수신 피크: ${overallPeakHz} Hz`;
            } else {
                measuredHzText.innerText = `수신: -- Hz`;
            }

            // Always render Spectrum Analyzer
            statusDot.className = activeCount > 0 ? "w-2 h-2 rounded-full bg-emerald-400 animate-pulse" : "w-2 h-2 rounded-full bg-slate-500";
            statusText.innerText = activeCount > 0 ? `${activeCount}개 주파수 수신 중` : "수신 대기";
            statusText.className = activeCount > 0 ? "text-emerald-400 font-bold" : "text-slate-400";

            const displayMaxHz = 7500;
            const totalBins = Math.floor(displayMaxHz / binResolution);
            const barWidth = width / totalBins;

            for (let i = 0; i < totalBins; i++) {
                const val = Math.min(255, freqData[i] * gainMultiplier);
                if (val > 0) {
                    const barHeight = (val / 255) * height;
                    const x = i * barWidth;

                    const hue = 200 - (val / 255) * 140;
                    freqCtx.fillStyle = `hsl(${hue}, 100%, 50%)`;
                    freqCtx.fillRect(x, height - barHeight, Math.max(1.5, barWidth), barHeight);
                }
            }

            FREQ_TABLE.forEach(item => {
                const targetX = (item.target / displayMaxHz) * width;
                const isSelected = selectedChannel && selectedChannel.id === item.id;
                
                freqCtx.strokeStyle = isSelected ? 'rgba(34, 211, 238, 0.9)' : 'rgba(6, 182, 212, 0.3)';
                freqCtx.lineWidth = isSelected ? 2 : 1;
                freqCtx.beginPath();
                freqCtx.moveTo(targetX, 0);
                freqCtx.lineTo(targetX, height);
                freqCtx.stroke();

                freqCtx.fillStyle = isSelected ? '#22d3ee' : '#38bdf8';
                freqCtx.font = isSelected ? 'bold 10px sans-serif' : '9px sans-serif';
                freqCtx.fillText(item.id, targetX - 5, 12);
            });
        }

        function addFaultLog(msg) {
            const logBox = document.getElementById("faultLogBox");
            const timeStr = new Date().toLocaleTimeString();
            const logItem = document.createElement("div");
            logItem.className = "text-rose-400 font-bold border-b border-slate-900 pb-0.5";
            logItem.innerText = `[${timeStr}] ${msg}`;
            logBox.prepend(logItem);

            // Keep max 30 logs
            if (logBox.children.length > 30) {
                logBox.removeChild(logBox.lastChild);
            }
        }

        function clearLogs() {
            const logBox = document.getElementById("faultLogBox");
            logBox.innerHTML = `<span class="text-slate-600">로그가 초기화되었습니다.</span>`;
        }

        window.addEventListener('resize', () => {
            if (isMeasuring) updateCanvasSize();
            else drawEmptyGrid();
        });

        initGrid();
        drawEmptyGrid();
    </script>
</body>
</html>
